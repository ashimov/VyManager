services:
  postgres:
    image: postgres:15-alpine
    container_name: vymanager-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vymanager}
      # No default: fail fast if the password is not provided via the root .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vymanager_auth}
    # Bound to localhost only - reachable by host-run backend, not from the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vymanager} -d ${POSTGRES_DB:-vymanager_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vymanager-redis
    # Bound to localhost only - Redis has no auth, so it must not be exposed to
    # the network. Set REDIS_PASSWORD in .env to also require auth.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
